<style>
:root {
  --profit:      #E60012;
  --profit-bg:   #FEF0F0;
  --loss:        #2D8A4E;
  --loss-bg:     #EEF7F0;
  --gold:        #D4A843;
  --gold-light:  #FAF4E5;
  --bg:          #FBF6F0;
  --card:        #FFFFFF;
  --text:        #3D2E2E;
  --text-secondary: #8B7870;
  --text-muted:  #B8A8A0;
  --border:      #E8DCD0;
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.04);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.05);
  --radius:      12px;
  --transition:  0.15s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%; overflow-x: hidden;
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none;
  user-select: none;
}
.app {
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  max-width: 570px; margin: 0 auto;
  padding: 6px 14px 12px;
}

/* Header */
.header {
  text-align: center; padding: 2px 0 4px;
}
.header h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.2rem; font-weight: 700; color: var(--profit);
  letter-spacing: 3px;
}
.header .date-row {
  font-size: 0.72rem; color: var(--text-muted); margin-top: 1px;
}

/* Table */
.table-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-card); overflow: hidden;
  margin-bottom: 6px; border: 2px solid #C9A84C;
}
table.overview { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid #C9A84C; border-radius: var(--radius); overflow: hidden; }
table.overview thead th {
  font-size: 0.82rem; font-weight: 700; color: #1a1a1a;
  padding: 8px 4px 6px; text-align: center;
  background: var(--bg); border-bottom: 2px solid #C9A84C;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  letter-spacing: 1px;
  white-space: nowrap;
}
table.overview tbody td {
  padding: 3px 3px; text-align: center; font-size: 0.78rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
table.overview tbody tr:last-child td { border-bottom: none; }

/* Column widths */
th.col-no  { width: 30px; }
th.col-name { width: 76px; }
th.col-qty { width: 70px; }
th.col-cost { width: 70px; }
th.col-price { width: 68px; }
th.col-mkt  { width: 78px; }
th.col-pl   { width: 86px; }
th.col-pct  { width: 64px; }

/* Editable cells (qty / cost / price) */
td.edit-cell { padding: 2px 2px; }
td.edit-cell input {
  width: 100%; max-width: 100%;
  padding: 5px 3px; font-size: 0.78rem; font-weight: 600;
  border: 1.5px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); text-align: center;
  transition: all var(--transition);
  font-family: inherit; -webkit-appearance: none;
  -webkit-user-select: text; user-select: text;
  font-variant-numeric: tabular-nums;
}
td.edit-cell input:focus {
  outline: none; border-color: var(--gold); background: #FFF;
  box-shadow: 0 0 0 2px rgba(212,168,67,0.15);
}
td.edit-cell input.dirty { border-color: var(--gold); background: var(--gold-light); }

/* Drag reorder */
td.col-no { cursor: grab; user-select: none; -webkit-user-select: none; }
td.col-no:active { cursor: grabbing; }
tr.drag-ghost { opacity: 0.2; }
tr.drag-over td { border-top: 2.5px solid var(--gold) !important; }
.drag-row-clone { position: fixed; z-index: 9999; pointer-events: none; opacity: 0.88; box-shadow: 0 6px 24px rgba(0,0,0,0.2); border-radius: 4px; transition: none; }

/* Values */
td.val-qty { font-weight: 500; color: var(--text); }
td.val-cost { font-weight: 700; font-size: 0.82rem; color: var(--text); }
td.val-mkt { font-weight: 600; color: var(--text); }
td.val-pl, td.val-pct { font-weight: 700; }
td.val-pl.profit, td.val-pct.profit { color: var(--profit); }
td.val-pl.loss, td.val-pct.loss { color: var(--loss); }

/* Summary row */
tfoot td {
  padding: 8px 4px; font-weight: 700; font-size: 0.8rem;
  background: var(--bg); border-top: 2px solid var(--border) !important;
}
tfoot td.profit { color: var(--profit); }
tfoot td.loss { color: var(--loss); }

/* Action bar */
.action-bar {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.btn {
  flex: 1; padding: 10px;
  border: none; border-radius: 10px;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  letter-spacing: 2px; transition: all var(--transition);
  font-family: 'Noto Serif SC', serif;
}
.btn:active { transform: scale(0.98); }
.btn-save {
  background: linear-gradient(135deg, var(--profit), #B8000E);
  color: #FFF;
}
.btn-save:disabled {
  background: var(--text-muted); opacity: 0.5; cursor: not-allowed;
}
.btn-save.saved {
  background: var(--loss);
}
.btn-refresh {
  background: linear-gradient(135deg, #C4956A, #A67B5B);
  color: #FFF;
}
.btn-refresh:disabled {
  background: var(--text-muted); opacity: 0.5; cursor: not-allowed;
}
.btn-refresh.loading {
  opacity: 0.7; cursor: wait;
}

/* Toast */
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #FFF; padding: 10px 24px;
  border-radius: 20px; font-size: 0.82rem; font-weight: 600;
  z-index: 200; opacity: 0; transition: opacity 0.25s;
  pointer-events: none; letter-spacing: 1px;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--loss); }
.toast.error { background: var(--profit); }

/* Links */
.links {
  text-align: center; font-size: 0.65rem; color: var(--text-muted);
}
.links a { color: var(--gold); text-decoration: none; }

/* Desktop scale-up to 120% */
@media (min-width: 768px) {
  html { font-size: 18px; }
  .app {
    transform: scale(1.25);
    transform-origin: top center;
    margin-bottom: 0;
  }
}

/* Mobile tweaks */
@media (max-width: 400px) {
  table.overview thead th { font-size: 0.62rem; padding: 6px 1px 4px; }
  table.overview tbody td { font-size: 0.72rem; padding: 3px 1px; }
  td.edit-cell input { font-size: 0.7rem; padding: 5px 1px; }
}
</style>
</head>

<script>
// ========== SUPABASE INIT ==========
const _supabase = (typeof supabase !== 'undefined' && supabase.createClient)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_ANON_KEY);
let _user = null;
const AUTH_KEY = 'tcalc_user_v1';

// ========== AUTH ==========
function showAuth() {
  document.getElementById('authOverlay').style.display = 'flex';
  document.querySelector('.app').style.display = 'none';
}
function hideAuth() {
  document.getElementById('authOverlay').style.display = 'none';
  document.querySelector('.app').style.display = 'flex';
}
function setAuthMsg(msg, isError) {
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.style.color = isError ? 'var(--profit)' : 'var(--loss, #2D8A4E)';
}
async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthMsg('请输入邮箱和密码', true); return; }
  document.getElementById('loginBtn').disabled = true;
  setAuthMsg('登录中...', false);
  const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
  document.getElementById('loginBtn').disabled = false;
  if (error) { setAuthMsg(error.message, true); return; }
  _user = data.user;
  localStorage.setItem(AUTH_KEY, JSON.stringify({ email: _user.email }));
  hideAuth();
  await initApp();
}
async function doSignup() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthMsg('请输入邮箱和密码', true); return; }
  if (password.length < 6) { setAuthMsg('密码至少6位', true); return; }
  document.getElementById('signupBtn').disabled = true;
  setAuthMsg('注册中...', false);
  const { data, error } = await _supabase.auth.signUp({
    email, password,
    options: { emailRedirectTo: 'https://t.ai-zhihui.cn' }
  });
  document.getElementById('signupBtn').disabled = false;
  if (error) { setAuthMsg(error.message, true); return; }
  if (data.user && !data.session) {
    setAuthMsg('注册成功！请查收邮箱确认链接，然后登录。', false);
  } else {
    _user = data.user;
    localStorage.setItem(AUTH_KEY, JSON.stringify({ email: _user.email }));
    hideAuth();
    await initApp();
  }
}
async function doLogout() {
  await _supabase.auth.signOut();
  _user = null;
  localStorage.removeItem(AUTH_KEY);
  showAuth();
}
async function checkSession() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session?.user) {
    _user = session.user;
    hideAuth();
    await initApp();
  } else {
    showAuth();
  }
}

// ========== DATA ==========
const STORAGE_KEY = 'tcalc_overview_v1';
let portfolio = [];
let dirty = false;

async function loadDataFromCloud() {
  if (!_user) return false;
  try {
    const { data, error } = await _supabase.from('stocks')
      .select('*')
      .eq('user_id', _user.id)
      .order('sort_order');
    if (error || !data || data.length === 0) return false;
    portfolio = data.map(row => ({
      id: row.id,
      name: row.name,
      code: row.code || '',
      costPrice: parseFloat(row.cost_price) || 0,
      holdQty: parseInt(row.hold_qty) || 0,
      price: parseFloat(row.open_price) || 0,
      date: '', time: '',
    }));
    return true;
  } catch(e) { console.error('Cloud load failed:', e); return false; }
}

function loadData() {
  // 先用本地缓存
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw && portfolio.length > 0) {
    try {
      const saved = JSON.parse(raw);
      if (Array.isArray(saved)) {
        saved.forEach((sv, i) => {
          if (i < portfolio.length) {
            if (sv.code != null) portfolio[i].code = sv.code;
            if (sv.price != null) portfolio[i].price = parseFloat(sv.price);
            if (sv.costPrice != null) portfolio[i].costPrice = parseFloat(sv.costPrice);
            if (sv.holdQty != null) portfolio[i].holdQty = parseFloat(sv.holdQty);
            portfolio[i].date = sv.date || '';
            portfolio[i].time = sv.time || '';
          }
        });
      }
    } catch(e) {}
  }
}

async function initApp() {
  const cloudOk = await loadDataFromCloud();
  if (cloudOk) {
    // 云端数据优先，更新本地缓存
    localStorage.setItem(STORAGE_KEY, JSON.stringify(portfolio.map(s => ({
      id: s.id, name: s.name, code: s.code || '', costPrice: s.costPrice, holdQty: s.holdQty,
      price: s.price, date: s.date, time: s.time
    }))));
  } else {
    // 云端无数据，清空显示
    portfolio = [];
    localStorage.removeItem(STORAGE_KEY);
  }
  renderTable();
  // 按名称从全量表补全缺失的 code（并回写数据库）
  backfillMissingCodes();
  if (_user && _user.email) {
    document.getElementById('dateLabel').textContent = '数据更新：-- · ' + _user.email;
  }
}

function fmtMoney(v) {
  if (v == null || isNaN(v)) return '--';
  if (Math.abs(v) < 0.005) return '0.00';
  return v.toFixed(2);
}

function fmtMoney4(v) {
  if (v == null || isNaN(v)) return '--';
  if (Math.abs(v) < 0.00005) return '0.0000';
  return v.toFixed(4);
}

function fmtPct(v) {
  if (v == null || isNaN(v)) return '--';
  const sign = v >= 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}

function calcRow(s) {
  const cost = s.costPrice;
  const qty  = s.holdQty;
  const price = s.price;
  const costOk = (cost != null && !isNaN(cost) && cost > 0);
  const qtyOk  = (qty != null && !isNaN(qty) && qty > 0);
  const priceOk = (price != null && !isNaN(price) && price > 0);
  const mkt = (priceOk && qtyOk) ? (price * qty) : null;
  const pl  = (priceOk && qtyOk && costOk) ? ((price - cost) * qty) : null;
  const pct = (priceOk && costOk) ? ((price - cost) / cost * 100) : null;
  return { costOk, qtyOk, priceOk, mkt, pl, pct };
}

let _ovDragState = null; // { fromIdx, startY, moved }
function renderTable() {
  const tbody = document.getElementById('tableBody');
  let html = '';

  portfolio.forEach((s, i) => {
    const r = calcRow(s);
    const plCls  = (r.pl  != null) ? (r.pl  >= 0 ? 'profit' : 'loss') : '';
    const pctCls = (r.pct != null) ? (r.pct >= 0 ? 'profit' : 'loss') : '';

    html += '<tr data-idx="' + i + '">';
    html += '<td class="col-no" style="color:var(--text-muted)">' + (i + 1) + '</td>';
    html += '<td class="col-name" style="font-weight:700;white-space:nowrap;cursor:pointer;user-select:text;-webkit-user-select:text;" title="双击复制名称">' + s.name + '</td>';
    // 持仓输入
    html += '<td class="edit-cell"><input type="text" inputmode="numeric" id="qty_' + i + '"'
      + ' placeholder="数量" value="' + (r.qtyOk ? s.holdQty : '') + '"'
      + ' oninput="onQtyInput(' + i + ', this)"></td>';
    // 成本输入
    html += '<td class="edit-cell"><input type="text" inputmode="decimal" id="cost_' + i + '"'
      + ' placeholder="成本" value="' + (r.costOk ? s.costPrice : '') + '"'
      + ' oninput="onCostInput(' + i + ', this)"></td>';
    // 现价输入
    html += '<td class="edit-cell"><input type="text" inputmode="decimal" id="price_' + i + '"'
      + ' placeholder="现价" value="' + (r.priceOk ? s.price.toFixed(2) : '') + '"'
      + ' oninput="onPriceInput(' + i + ', this)"></td>';
    // 市值 / 盈亏 / 盈亏%
    html += '<td class="val-mkt" id="mkt_' + i + '">' + (r.mkt != null ? (r.mkt / 10000).toFixed(2) + '万' : '--') + '</td>';
    html += '<td class="val-pl ' + plCls + '" id="pl_' + i + '">' + (r.pl != null ? (r.pl >= 0 ? '+' : '') + fmtMoney(r.pl) : '--') + '</td>';
    html += '<td class="val-pct ' + pctCls + '" id="pct_' + i + '">' + fmtPct(r.pct) + '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
  updateFoot();
  updateDateLabel();
}

function updateFoot() {
  let totalMkt = 0, totalPL = 0, totalCost = 0, totalQty = 0;
  let costBg = 0; // 已参与盈亏计算的成本基数
  portfolio.forEach(s => {
    const r = calcRow(s);
    if (r.mkt != null) totalMkt += r.mkt;
    if (r.pl  != null) totalPL  += r.pl;
    if (r.costOk && r.qtyOk) totalCost += s.costPrice * s.holdQty;
    if (r.qtyOk) totalQty += s.holdQty;
  });
  const foot = document.getElementById('tableFoot');
  const totalPlCls = totalPL >= 0 ? 'profit' : 'loss';
  // 总盈亏率 = 总盈亏 / 总成本
  const totalCostBasis = portfolio.reduce((a, s) => {
    const r = calcRow(s);
    return a + (r.costOk && r.qtyOk ? s.costPrice * s.holdQty : 0);
  }, 0);
  const totalPct = (totalCostBasis > 0) ? (totalPL / totalCostBasis * 100) : null;
  foot.innerHTML =
    '<tr>'
    + '<td colspan="2" style="text-align:left;padding-left:8px">合计</td>'
    + '<td>' + totalQty.toLocaleString() + '股</td>'
    + '<td>' + (totalCostBasis > 0 ? (totalCostBasis / 10000).toFixed(2) + '万' : '--') + '</td>'
    + '<td>--</td>'
    + '<td>' + (totalMkt > 0 ? (totalMkt / 10000).toFixed(2) + '万' : '--') + '</td>'
    + '<td class="' + totalPlCls + '">' + (totalPL >= 0 ? '+' : '') + fmtMoney(totalPL) + '</td>'
    + '<td class="' + totalPlCls + '">' + (totalPct != null ? (totalPct >= 0 ? '+' : '') + totalPct.toFixed(2) + '%' : '--') + '</td>'
    + '</tr>';
}

function updateRow(idx) {
  const s = portfolio[idx];
  const r = calcRow(s);
  const mktEl = document.getElementById('mkt_' + idx);
  const plEl  = document.getElementById('pl_' + idx);
  const pctEl = document.getElementById('pct_' + idx);
  if (!mktEl || !plEl || !pctEl) return;

  mktEl.textContent = (r.mkt != null ? (r.mkt / 10000).toFixed(2) + '万' : '--');

  const plCls  = (r.pl  != null) ? (r.pl  >= 0 ? 'profit' : 'loss') : '';
  const pctCls = (r.pct != null) ? (r.pct >= 0 ? 'profit' : 'loss') : '';
  plEl.className = 'val-pl ' + plCls;
  pctEl.className = 'val-pct ' + pctCls;
  plEl.textContent = (r.pl != null ? (r.pl >= 0 ? '+' : '') + fmtMoney(r.pl) : '--');
  pctEl.textContent = fmtPct(r.pct);
}

// ========== DRAG REORDER (序号列) ==========
// ──── 双击名称复制到剪贴板 ────
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e) {}
  // 兑底：旧方案
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  } catch(e) { return false; }
}

function initNameCopy() {
  const tbody = document.getElementById('tableBody');
  tbody.addEventListener('dblclick', async function(e) {
    const td = e.target.closest('td.col-name');
    if (!td) return;
    const name = (td.textContent || '').trim();
    if (!name) return;
    const ok = await copyText(name);
    showToast(ok ? '已复制：' + name : '复制失败', ok ? 'success' : 'error');
  });
}

// ──── Row Drag (Pointer Events) ────
function initOvDrag() {
  const tbody = document.getElementById('tableBody');
  tbody.addEventListener('pointerdown', function(e) {
    if (e.button && e.button !== 0) return;
    const td = e.target.closest('td.col-no');
    if (!td) return;
    const row = td.closest('tr');
    if (!row) return;
    const idx = parseInt(row.dataset.idx);
    if (isNaN(idx)) return;
    e.preventDefault();
    _ovDragState = { fromIdx: idx, startY: e.clientY, moved: false, clone: null, ghost: null };
    document.addEventListener('pointermove', onOvPointerMove);
    document.addEventListener('pointerup', onOvPointerUp);
  });
}

function onOvPointerMove(e) {
  if (!_ovDragState) return;
  const dy = Math.abs(e.clientY - _ovDragState.startY);
  if (dy > 6 && !_ovDragState.moved) {
    _ovDragState.moved = true;
    // 创建浮动克隆 + 原行变幽灵
    const tbody = document.getElementById('tableBody');
    const rows = tbody.querySelectorAll('tr');
    const origRow = rows[_ovDragState.fromIdx];
    if (origRow) {
      const clone = origRow.cloneNode(true);
      clone.className = 'drag-row-clone';
      clone.style.width = origRow.offsetWidth + 'px';
      const r = origRow.getBoundingClientRect();
      clone.style.left = r.left + 'px';
      clone.style.top = r.top + 'px';
      document.body.appendChild(clone);
      _ovDragState.clone = clone;
      origRow.classList.add('drag-ghost');
      _ovDragState.ghost = origRow;
    }
  }
  if (!_ovDragState.moved) return;
  // 移动克隆
  if (_ovDragState.clone) {
    _ovDragState.clone.style.top = (e.clientY - 18) + 'px';
  }
  // 找悬停行，移动幽灵到目标位置
  const tbody = document.getElementById('tableBody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const nonGhost = rows.filter(r => !r.classList.contains('drag-ghost'));
  let insertBefore = null;
  for (const r of nonGhost) {
    const rect = r.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) { insertBefore = r; break; }
  }
  if (_ovDragState.ghost) {
    if (insertBefore) {
      tbody.insertBefore(_ovDragState.ghost, insertBefore);
    } else {
      tbody.appendChild(_ovDragState.ghost);
    }
  }
}

function onOvPointerUp(e) {
  document.removeEventListener('pointermove', onOvPointerMove);
  document.removeEventListener('pointerup', onOvPointerUp);
  if (!_ovDragState) return;
  if (_ovDragState.moved && _ovDragState.clone) {
    const tbody = document.getElementById('tableBody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const dropIdx = rows.indexOf(_ovDragState.ghost);
    const fromIdx = _ovDragState.fromIdx;
    // 动画：克隆飞到幽灵位置
    if (dropIdx >= 0 && _ovDragState.ghost) {
      const targetR = _ovDragState.ghost.getBoundingClientRect();
      _ovDragState.clone.style.transition = 'all 0.2s ease';
      _ovDragState.clone.style.top = targetR.top + 'px';
    }
    setTimeout(function() {
      if (_ovDragState && _ovDragState.clone) _ovDragState.clone.remove();
      if (_ovDragState && _ovDragState.ghost) _ovDragState.ghost.classList.remove('drag-ghost');
      if (dropIdx >= 0 && dropIdx !== fromIdx) {
        // overview 输入直接写 portfolio[idx]，无需先读 form，直接重排
        const item = portfolio.splice(fromIdx, 1)[0];
        portfolio.splice(dropIdx, 0, item);
      }
      renderTable();
      dirty = true;
      saveAll();
      _ovDragState = null;
    }, 200);
  } else {
    if (_ovDragState.clone) _ovDragState.clone.remove();
    if (_ovDragState.ghost) _ovDragState.ghost.classList.remove('drag-ghost');
    _ovDragState = null;
  }
}


// ========== INPUT HANDLERS ==========
function setDirtyFlag() {
  dirty = true;
  const btn = document.getElementById('btnSave');
  btn.disabled = false;
  btn.textContent = '💾 保存更新';
  btn.classList.remove('saved');
}

// 通用：解析输入为数字；空字符串→null；非法→保持原值并返回 false
function parseInput(el, raw) {
  if (raw === '') {
    el.classList.remove('dirty');
    return null;
  }
  const num = parseFloat(raw);
  if (isNaN(num) || num < 0) {
    el.classList.add('dirty');
    return undefined; // 非法：不改动原值，仅标红提示
  }
  el.classList.remove('dirty');
  return num;
}

function onQtyInput(idx, el) {
  const raw = el.value.trim();
  const num = parseInput(el, raw);
  if (num === undefined) { setDirtyFlag(); return; } // 非法输入，保持旧值
  if (num === null) { portfolio[idx].holdQty = null; }
  else { portfolio[idx].holdQty = num; }
  setDirtyFlag();
  updateRow(idx);
  updateFoot();
}

function onCostInput(idx, el) {
  const raw = el.value.trim();
  const num = parseInput(el, raw);
  if (num === undefined) { setDirtyFlag(); return; }
  if (num === null) { portfolio[idx].costPrice = null; }
  else { portfolio[idx].costPrice = num; }
  setDirtyFlag();
  updateRow(idx);
  updateFoot();
}

function onPriceInput(idx, el) {
  const raw = el.value.trim();
  const num = parseInput(el, raw);
  if (num === undefined) { setDirtyFlag(); return; }
  if (num === null) { portfolio[idx].price = null; }
  else { portfolio[idx].price = num; }
  setDirtyFlag();
  updateRow(idx);
  updateFoot();
}

// ========== 股票代码映射 ==========
const STOCK_CODE_MAP = {
  '洪都航空': 'sh600316',
  '维远股份': 'sh600955',
  '京东方A': 'sz000725',
};

// 名称 → 全量代码反向索引（懒构建）
let _nameToCode = null;
function getNameToCode() {
  if (_nameToCode) return _nameToCode;
  const dict = (typeof window.STOCK_NAMES !== 'undefined') ? window.STOCK_NAMES : {};
  _nameToCode = {};
  for (const code in dict) {
    const name = dict[code];
    if (name && !_nameToCode[name]) _nameToCode[name] = code;
  }
  return _nameToCode;
}

function getStockCode(name) {
  if (!name) return '';
  // 1. 优先用数据库里的 code
  const s = portfolio.find(p => p.name === name);
  if (s && s.code) return s.code;
  // 2. 用全量映射表按名称反查代码
  const nt = getNameToCode();
  if (nt[name]) return nt[name];
  // 3. 硬编码兑底
  return STOCK_CODE_MAP[name] || '';
}

// 补全并回写缺失的 code（按名称从全量表反查）
async function backfillMissingCodes() {
  if (!_user) return;
  let changed = false;
  const nt = getNameToCode();
  portfolio.forEach(s => {
    if (!s.code && s.name && nt[s.name]) {
      s.code = nt[s.name];
      changed = true;
    }
  });
  if (changed) {
    // 回写数据库（逐条 upsert code）
    try {
      for (const s of portfolio) {
        if (s.id && s.code) {
          await _supabase.from('stocks').update({ code: s.code }).eq('id', s.id);
        }
      }
    } catch(e) { console.error('backfill code failed:', e); }
  }
  return changed;
}

// ========== 实时行情获取 ==========
let _refreshTimer = null;
async function refreshPrices() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = '⏳ 获取中...';

  // 收集需要获取行情的股票代码
  const tasks = [];
  portfolio.forEach((s, i) => {
    const code = getStockCode(s.name);
    if (code) tasks.push({ idx: i, code: code });
  });

  if (tasks.length === 0) {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = '🔄 更新现价';
    showToast('没有可获取行情的股票（请先设置股票代码）', 'error');
    return;
  }

  // 批量查询（腾讯接口支持多只用逗号分隔）
  const codes = tasks.map(t => t.code).join(',');
  try {
    const resp = await fetch('https://qt.gtimg.cn/q=' + codes);
    const raw = await resp.text();
    // 编码转换：腾讯返回 GBK，浏览器自动解码
    const lines = raw.split(';').filter(l => l.trim());
    let updated = 0;
    lines.forEach(line => {
      const m = line.match(/v_([a-z]{2}\d+)="(.*)"/);
      if (!m) return;
      const code = m[1];
      const fields = m[2].split('~');
      // fields[3] = 现价, fields[1] = 名称
      const price = parseFloat(fields[3]);
      if (isNaN(price) || price <= 0) return;
      const task = tasks.find(t => t.code === code);
      if (task) {
        portfolio[task.idx].price = price;
        updated++;
      }
    });

    if (updated > 0) {
      // 更新所有行的显示
      portfolio.forEach((s, i) => {
        updateRow(i);
        // 同步更新价格输入框
        const priceEl = document.getElementById('price_' + i);
        if (priceEl && s.price != null && !isNaN(s.price) && s.price > 0) {
          priceEl.value = s.price.toFixed(2);
        }
      });
      updateFoot();
      setDirtyFlag();
      // 自动云同步：更新现价时，把持仓/成本等所有未保存修改一并落库
      await saveAll();
    } else {
      showToast('未获取到行情数据', 'error');
    }
  } catch(e) {
    console.error('Refresh price failed:', e);
    showToast('获取行情失败：' + e.message, 'error');
  }

  btn.disabled = false;
  btn.classList.remove('loading');
  btn.textContent = '🔄 更新现价';
}

// ========== DATE / TIME ==========
function updateDateLabel() {
  // 找出最新的一条 (date + time) 组合
  let latestDate = '', latestTime = '';
  let latestKey = '';
  portfolio.forEach(s => {
    if (s.date) {
      const key = s.date + ' ' + (s.time || '00:00');
      if (key > latestKey) {
        latestKey = key;
        latestDate = s.date;
        latestTime = s.time || '';
      }
    }
  });
  const label = document.getElementById('dateLabel');
  if (latestDate) {
    label.textContent = '数据更新：' + latestDate + (latestTime ? ' ' + latestTime : '');
  } else {
    label.textContent = '请在下表输入现价';
  }
}

async function saveAll() {
  const now = new Date();
  const dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  const timeStr = String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0');

  portfolio.forEach(s => {
    s.date = dateStr;
    s.time = timeStr;
  });

  // Save to localStorage（同步，立即持久化到本地）
  const toSave = portfolio.map(s => ({
    id: s.id, name: s.name, code: s.code || '', costPrice: s.costPrice, holdQty: s.holdQty,
    price: s.price, date: s.date, time: s.time
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));

  // 更新 UI（先反馈已保存到本地）
  dirty = false;
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '⏳ 同步中...';
  btn.classList.add('saved');
  updateDateLabel();

  // 【关键】立即同步云端，不等防抖
  const synced = await _syncOverviewToSupabase();
  if (synced) {
    btn.textContent = '✓ 已保存';
    showToast('已保存 · ' + dateStr + ' ' + timeStr, 'success');
  } else if (_user) {
    btn.textContent = '⚠️ 同步失败';
    btn.disabled = false;
    showToast('本地已存，云端同步失败，请重试', 'error');
  } else {
    btn.textContent = '✓ 已保存';
    showToast('已保存到本地（未登录）', 'success');
  }
}

// 返回 true 表示云端同步成功；未登录时返回 null（跳过）
async function _syncOverviewToSupabase() {
  if (!_user) return null;
  // 【安全防护】portfolio 为空时禁止同步，防止误清空云端数据
  if (!portfolio || portfolio.length === 0) {
    console.warn('Overview sync aborted: portfolio empty');
    return false;
  }
  try {
    const rows = portfolio.map((s, i) => ({
      user_id: _user.id,
      name: s.name,
      code: s.code || '',
      cost_price: s.costPrice,
      hold_qty: s.holdQty,
      open_price: s.price || 0,
      t_price1: 0, t_qty: 0, t_price2: 0,
      mode: 'reverse',
      sort_order: i,
    }));
    // 先删除旧数据，再写入新数据
    await _supabase.from('stocks').delete().eq('user_id', _user.id);
    const { error } = await _supabase.from('stocks').insert(rows);
    if (error) throw error;
    return true;
  } catch(e) {
    console.error('Overview sync failed:', e);
    return false;
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '') + ' show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => { t.classList.remove('show'); }, 2000);
}
