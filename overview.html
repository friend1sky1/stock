<style>
:root {
  --profit:      #E60012;
  --profit-bg:   #FEF0F0;
  --loss:        #2D8A4E;
  --loss-bg:     #EEF7F0;
  --gold:        #D4A843;
  --gold-light:  #FAF4E5;
  --bg:          #FBF6F0;
  --card:        #FFFFFF;
  --text:        #3D2E2E;
  --text-secondary: #8B7870;
  --text-muted:  #B8A8A0;
  --border:      #E8DCD0;
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.04);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.05);
  --radius:      12px;
  --transition:  0.15s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%; overflow-x: hidden;
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none;
  user-select: none;
}
.app {
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  max-width: 570px; margin: 0 auto;
  padding: 6px 14px 12px;
}

/* Header */
.header {
  text-align: center; padding: 2px 0 4px;
}
.back-bar {
  position: absolute; left: 4px; top: 6px;
  font-size: 0.85rem; font-weight: 600; color: var(--gold);
  text-decoration: none; letter-spacing: 0.5px;
  transition: all var(--transition);
}
.back-bar:active { opacity: 0.6; }
.header h1 {
  font-family: 'Songti SC','STSong','SimSun','Noto Serif CJK SC',Georgia,serif;
  font-size: 1.2rem; font-weight: 700; color: var(--profit);
  letter-spacing: 3px;
}
.header .date-row {
  font-size: 0.72rem; color: var(--text-muted); margin-top: 1px;
}

/* Table */
.table-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-card); overflow: hidden;
  margin-bottom: 6px; border: 2px solid #C9A84C;
}
table.overview { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid #C9A84C; border-radius: var(--radius); overflow: hidden; }
table.overview thead th {
  font-size: 0.82rem; font-weight: 700; color: #1a1a1a;
  padding: 8px 4px 6px; text-align: center;
  background: var(--bg); border-bottom: 2px solid #C9A84C;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  letter-spacing: 1px;
  white-space: nowrap;
}
table.overview thead th.sortable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
table.overview thead th.sortable:active { background: var(--gold-light); }
/* ── 到价提醒（与做T计算器共用同一份 localStorage） ── */
.ov-bell {
  display:inline-block; font-size:0.85rem; line-height:1; cursor:pointer;
  opacity:0.35; padding:2px 3px; vertical-align:middle;
  -webkit-user-select:none; user-select:none; transition:opacity .15s, transform .15s;
}
.ov-bell.on  { opacity:1; transform:scale(1.1); }
.ov-bell.hit { opacity:1; animation:ovPulse .8s ease infinite; }
@keyframes ovPulse { 0%,100%{opacity:1} 50%{opacity:.25} }
.alert-sheet-mask {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:9999;
  background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center;

tfoot td.loss { color: var(--loss); }

/* Action bar */
.action-bar {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.btn {
  flex: 1; padding: 10px;
  border: none; border-radius: 10px;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  letter-spacing: 2px; transition: all var(--transition);
  font-family: 'Songti SC','STSong','SimSun','Noto Serif CJK SC',Georgia,serif;

.btn:active { transform: scale(0.98); }
.btn-save {

.btn-save:disabled {

.btn-refresh {

}
.btn-refresh:disabled {

}
.btn-refresh.loading {

/* Toast */
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #FFF; padding: 10px 24px;
  border-radius: 20px; font-size: 0.82rem; font-weight: 600;

.toast.error { background: var(--profit); }

/* Links */
.links {

.links a { color: var(--gold); text-decoration: none; }

/* Desktop scale-up to 120% */

  td.edit-cell input { font-size: 0.7rem; padding: 5px 1px; }
}
</style>

<script>
// ========== SUPABASE INIT ==========
const _supabase = (typeof supabase !== 'undefined' && supabase.createClient)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : (window.supabase && window.supabase.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null);
let _user = null;

// 与做T计算器共用：本地缓存的用户名（避免刷新闪烁）+ 云端用户名缓存
const PROFILE_NAME_CACHE_KEY = 'tcalc_profile_name_v1';
let _profileName = null;
function getCachedProfileName() {
  try { return localStorage.getItem(PROFILE_NAME_CACHE_KEY) || ''; } catch (e) { return ''; }
}
function setCachedProfileName(name) {
  try {
    if (name) localStorage.setItem(PROFILE_NAME_CACHE_KEY, name);
    else localStorage.removeItem(PROFILE_NAME_CACHE_KEY);
  } catch (e) {}
}
// 取显示名：云端 user_profiles.username 优先，其次本地缓存，最后邮箱前缀
async function getDisplayName() {
  const cached = getCachedProfileName();
  if (_user && _supabase) {
    try {
      const { data, error } = await _supabase.from('user_profiles')
        .select('username').eq('user_id', _user.id).maybeSingle();
      if (!error && data && data.username) { setCachedProfileName(data.username); return data.username; }
    } catch (e) {}
  }
  return cached || (_user && _user.email ? _user.email.split('@')[0] : '');
}

// ========== 数据库冷启动唤醒 + 自动重试 ==========
// 背景：云端数据库免费版空闲时会休眠，第一个请求需 10~30 秒唤醒 → 前端超时报 "Failed to fetch"。
const DB_RETRY_DELAYS = [2500, 5000];
const DB_WARM_TIMEOUT = 30000;

// 方案2：页面加载即 ping 一次数据库唤醒它
function warmupDatabase() {
  try {
    if (typeof fetch !== 'function') return Promise.resolve('no-fetch');
    const p = fetch(SUPABASE_URL + '/auth/v1/health', {
      method: 'GET', cache: 'no-store',
      headers: { 'apikey': SUPABASE_ANON_KEY }
    });
    const timer = new Promise(r => setTimeout(() => r('timeout'), DB_WARM_TIMEOUT));
    return Promise.race([p, timer]).then(() => 'ok').catch(() => 'fail');
  } catch (e) { return Promise.resolve('fail'); }
}

// 方案1 + 3：失败自动重试，最终失败给友好中文提示
async function dbFetch(label, fn) {
  let lastErr = null;
  for (let attempt = 0; attempt <= DB_RETRY_DELAYS.length; attempt++) {
    if (attempt > 0) {
      showConnBanner('正在连接云端数据…（第 ' + (attempt + 1) + ' 次尝试）');
      await new Promise(r => setTimeout(r, DB_RETRY_DELAYS[attempt - 1]));
    }
    try {
      const res = await fn();
      hideConnBanner();
      return res;
    } catch (err) {
      lastErr = err;
      const msg = (err && (err.message || String(err))) || '';
      if (!/fetch|network|timeout|Failed to fetch|NetworkError|Load failed/i.test(msg)) throw err;
    }
  }
  hideConnBanner();
  showConnFailBanner(label);
  throw new Error('网络连接失败');
}

function showConnBanner(text) {
  let el = document.getElementById('connBanner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'connBanner';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10000;background:#C4956A;color:#fff;font-size:0.8rem;text-align:center;padding:6px 10px;box-shadow:0 1px 4px rgba(0,0,0,.15);';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.display = 'block';
}
function hideConnBanner() {
  const el = document.getElementById('connBanner');
  if (el) el.style.display = 'none';
}
function showConnFailBanner(label) {
  let el = document.getElementById('connBanner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'connBanner';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10000;background:#B23A3A;color:#fff;font-size:0.82rem;text-align:center;padding:8px 10px;';
    document.body.appendChild(el);
  }
  el.style.background = '#B23A3A';
  el.style.display = 'block';
  el.innerHTML = '⚠️ 云端连接失败（可能网络不稳或服务刚唤醒），请'
    + '<a href="javascript:location.reload()" style="color:#FFF;text-decoration:underline;font-weight:600;margin:0 4px;">点击重试</a>。';
}
const AUTH_KEY = 'tcalc_user_v1';

// ========== AUTH ==========
function showAuth() {
  document.getElementById('authOverlay').style.display = 'flex';
  document.querySelector('.app').style.display = 'none';
}
function hideAuth() {
  document.getElementById('authOverlay').style.display = 'none';
  document.querySelector('.app').style.display = 'flex';
}
function setAuthMsg(msg, isError) {
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.style.color = isError ? 'var(--profit)' : 'var(--loss, #2D8A4E)';
}

// 将云端返回的英文报错翻译为中文，并给出下一步引导
function friendlyAuthError(err, flow) {
  const m = (err && err.message ? err.message : '').toLowerCase();
  if (m.includes('already registered') || m.includes('already been registered') || m.includes('user already')) {
    return '该邮箱已注册！请直接用这个邮箱和密码登录（上方邮箱、密码填好后点「登录」）。';
  }
  if (m.includes('invalid login credentials') || m.includes('invalid credentials')) {
    return '邮箱或密码不正确，请重新输入。';
  }
  if (m.includes('email not confirmed') || m.includes('not confirmed')) {
    return '邮箱还未验证，请先到邮箱点开确认链接再登录。';
  }
  if (m.includes('password should be at least') || m.includes('password is too short')) {
    return '密码至少需要 6 位。';
  }
  if (m.includes('unable to validate email') || m.includes('invalid format') || m.includes('invalid email')) {
    return '邮箱格式不正确，请检查后重试。';
  }
  if (m.includes('rate limit') || m.includes('too many requests') || m.includes('email rate limit')) {
    return '操作太频繁了，请稍等 1 分钟再试。';
  }
  if (m.includes('network') || m.includes('failed to fetch')) {
    return '网络连接失败，请检查网络后重试。';
  }
  return '操作失败，请稍后重试。' + (err && err.message ? '（' + err.message + '）' : '');
}

function fmtMoney(v) {
  if (v == null || isNaN(v)) return '--';
  if (Math.abs(v) < 0.005) return '0.00';
  return v.toFixed(2);
}

function fmtMoney4(v) {
  if (v == null || isNaN(v)) return '--';
  if (Math.abs(v) < 0.00005) return '0.0000';
  return v.toFixed(4);
}

function fmtPct(v) {
  if (v == null || isNaN(v)) return '--';
  const sign = v >= 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}

function calcRow(s) {
  const cost = s.costPrice;
  const qty  = s.holdQty;
  const price = s.price;
  const costOk = (cost != null && !isNaN(cost) && cost > 0);
  const qtyOk  = (qty != null && !isNaN(qty) && qty > 0);
  const priceOk = (price != null && !isNaN(price) && price > 0);
  const mkt = (priceOk && qtyOk) ? (price * qty) : null;
  const pl  = (priceOk && qtyOk && costOk) ? ((price - cost) * qty) : null;
  const pct = (priceOk && costOk) ? ((price - cost) / cost * 100) : null;
  return { costOk, qtyOk, priceOk, mkt, pl, pct };
}

let _ovDragState = null; // { fromIdx, startY, moved }

// ========== 临时排序 ==========
let _sortKey = null;    // 当前排序列: index/name/qty/cost/price/mkt/pl/pct
let _sortDir = 1;       // 1=升序, -1=降序

function _sortValue(s, key) {
  const r = calcRow(s);
  switch (key) {
    case 'name':  return s.name || '';
    case 'qty':   return r.qtyOk ? s.holdQty : null;
    case 'cost':  return r.costOk ? s.costPrice : null;
    case 'price': return r.priceOk ? s.price : null;
    case 'mkt':   return r.mkt;
    case 'pl':    return r.pl;
    case 'pct':   return r.pct;
    default:      return null;
  }
}

function sortBy(key) {
  if (key === 'index') { _sortKey = null; _sortDir = 1; }
  else if (_sortKey === key) { _sortDir = -_sortDir; }
  else { _sortKey = key; _sortDir = 1; }
  renderTable();
}

function _displayIndices() {
  const n = portfolio.length;
  const idx = Array.from({ length: n }, (_, i) => i);
  if (!_sortKey) return idx; // 默认顺序
  return idx.sort((a, b) => {
    const va = _sortValue(portfolio[a], _sortKey);
    const vb = _sortValue(portfolio[b], _sortKey);
    // null 值永远排最后（无论升降序）
    const aNull = (va == null || va === '');
    const bNull = (vb == null || vb === '');
    if (aNull && bNull) return 0;
    if (aNull) return 1;
    if (bNull) return -1;
    if (typeof va === 'string') return va.localeCompare(vb, 'zh') * _sortDir;
    return (va - vb) * _sortDir;
  });
}

function _updateSortArrows() {
  for (const el of document.querySelectorAll('.sort-arrow')) {
    el.textContent = '';
  }
  if (_sortKey) {
    const arrow = document.getElementById('arrow_' + _sortKey);
    if (arrow) arrow.textContent = _sortDir === 1 ? ' ▲' : ' ▼';
  }
}

    html += '<td class="val-pct ' + pctCls + '" id="pct_' + i + '">' + fmtPct(r.pct) + '</td>';

      + '<button class="del-btn" onclick="deleteStock(' + i + ')" title="删除">🗑️</button></td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
  _updateSortArrows();
  updateFoot();
  updateDateLabel();
}

function updateFoot() {
  let totalMkt = 0, totalPL = 0, totalCost = 0, totalQty = 0;
  let costBg = 0; // 已参与盈亏计算的成本基数
  portfolio.forEach(s => {
    const r = calcRow(s);
    if (r.mkt != null) totalMkt += r.mkt;
    if (r.pl  != null) totalPL  += r.pl;
    if (r.costOk && r.qtyOk) totalCost += s.costPrice * s.holdQty;
    if (r.qtyOk) totalQty += s.holdQty;
  });
  const foot = document.getElementById('tableFoot');
  const totalPlCls = totalPL >= 0 ? 'profit' : 'loss';
  // 总盈亏率 = 总盈亏 / 总成本
  const totalCostBasis = portfolio.reduce((a, s) => {
    const r = calcRow(s);
    return a + (r.costOk && r.qtyOk ? s.costPrice * s.holdQty : 0);
  }, 0);
  const totalPct = (totalCostBasis > 0) ? (totalPL / totalCostBasis * 100) : null;
  foot.innerHTML =
    '<tr style="text-align:center">'
    + '<td colspan="2">合计</td>'
    + '<td>' + totalQty.toLocaleString() + '股</td>'
    + '<td>' + (totalCostBasis > 0 ? (totalCostBasis / 10000).toFixed(2) + '万' : '--') + '</td>'
    + '<td>--</td>'
    + '<td>' + (totalMkt > 0 ? (totalMkt / 10000).toFixed(2) + '万' : '--') + '</td>'
    + '<td class="' + totalPlCls + '">' + (totalPL >= 0 ? '+' : '') + fmtMoney(totalPL) + '</td>'
    + '<td class="' + totalPlCls + '">' + (totalPct != null ? (totalPct >= 0 ? '+' : '') + totalPct.toFixed(2) + '%' : '--') + '</td>'
    + '<td></td>'
    + '</tr>';
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e) {}
  // 兑底：旧方案
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  } catch(e) { return false; }
}

// ──── Row Drag (Pointer Events) ────
function initOvDrag() {
  const tbody = document.getElementById('tableBody');
  tbody.addEventListener('pointerdown', function(e) {
    if (e.button && e.button !== 0) return;
    const td = e.target.closest('td.col-no');
    if (!td) return;
    const row = td.closest('tr');
    if (!row) return;
    const idx = parseInt(row.dataset.idx);
    if (isNaN(idx)) return;
    // 拖拽调整的是真实持仓顺序，先清除临时排序
    _sortKey = null; _sortDir = 1;
    e.preventDefault();
    _ovDragState = { fromIdx: idx, startY: e.clientY, moved: false, clone: null, ghost: null };
    document.addEventListener('pointermove', onOvPointerMove);
    document.addEventListener('pointerup', onOvPointerUp);
  });
}

function onOvPointerMove(e) {
  if (!_ovDragState) return;
  const dy = Math.abs(e.clientY - _ovDragState.startY);
  if (dy > 6 && !_ovDragState.moved) {
    _ovDragState.moved = true;
    // 创建浮动克隆 + 原行变幽灵（通过 data-idx 定位原行）
    const tbody = document.getElementById('tableBody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const origRow = rows.find(r => parseInt(r.dataset.idx) === _ovDragState.fromIdx);
    if (origRow) {
      const clone = origRow.cloneNode(true);
      clone.className = 'drag-row-clone';
      clone.style.width = origRow.offsetWidth + 'px';
      const r = origRow.getBoundingClientRect();
      clone.style.left = r.left + 'px';
      clone.style.top = r.top + 'px';
      document.body.appendChild(clone);
      _ovDragState.clone = clone;
      origRow.classList.add('drag-ghost');
      _ovDragState.ghost = origRow;
    }
  }
  if (!_ovDragState.moved) return;
  // 移动克隆
  if (_ovDragState.clone) {
    _ovDragState.clone.style.top = (e.clientY - 18) + 'px';
  }
  // 找悬停行，移动幽灵到目标位置
  const tbody = document.getElementById('tableBody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const nonGhost = rows.filter(r => !r.classList.contains('drag-ghost'));
  let insertBefore = null;
  for (const r of nonGhost) {
    const rect = r.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) { insertBefore = r; break; }
  }
  if (_ovDragState.ghost) {
    if (insertBefore) {
      tbody.insertBefore(_ovDragState.ghost, insertBefore);
    } else {
      tbody.appendChild(_ovDragState.ghost);
    }
  }
}

function onOvPointerUp(e) {
  document.removeEventListener('pointermove', onOvPointerMove);
  document.removeEventListener('pointerup', onOvPointerUp);
  if (!_ovDragState) return;
  if (_ovDragState.moved && _ovDragState.clone) {
    const tbody = document.getElementById('tableBody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const dropIdx = rows.indexOf(_ovDragState.ghost);
    const fromIdx = _ovDragState.fromIdx;
    // 动画：克隆飞到幽灵位置
    if (dropIdx >= 0 && _ovDragState.ghost) {
      const targetR = _ovDragState.ghost.getBoundingClientRect();
      _ovDragState.clone.style.transition = 'all 0.2s ease';
      _ovDragState.clone.style.top = targetR.top + 'px';
    }
    setTimeout(function() {
      if (_ovDragState && _ovDragState.clone) _ovDragState.clone.remove();
      if (_ovDragState && _ovDragState.ghost) _ovDragState.ghost.classList.remove('drag-ghost');
      if (dropIdx >= 0 && dropIdx !== fromIdx) {
        // 读取当前 DOM 行的 data-idx 顺序，重写 portfolio
        const order = Array.from(tbody.querySelectorAll('tr'))
          .map(r => parseInt(r.dataset.idx))
          .filter(x => !isNaN(x));
        // 用索引重建，确保对象引用正确
        const newPortfolio = order.map(idx => portfolio[idx]);
        if (newPortfolio.length === portfolio.length) {
          portfolio = newPortfolio;
        }
      }
      renderTable();
      dirty = true;
      saveAll();
      _ovDragState = null;
    }, 200);
  } else {
    if (_ovDragState.clone) _ovDragState.clone.remove();
    if (_ovDragState.ghost) _ovDragState.ghost.classList.remove('drag-ghost');
    _ovDragState = null;
  }
}

function setDirtyFlag() {
  dirty = true;
  const btn = document.getElementById('btnSave');
  btn.disabled = false;

  btn.classList.remove('saved');
}

// 通用：解析输入为数字；空字符串→null；非法→保持原值并返回 false
function parseInput(el, raw) {
  if (raw === '') {
    el.classList.remove('dirty');
    return null;
  }
  const num = parseFloat(raw);
  if (isNaN(num) || num < 0) {
    el.classList.add('dirty');
    return undefined; // 非法：不改动原值，仅标红提示
  }
  el.classList.remove('dirty');
  return num;
}

function onQtyInput(idx, el) {
  const raw = el.value.trim();
  const num = parseInput(el, raw);
  if (num === undefined) { setDirtyFlag(); return; } // 非法输入，保持旧值
  if (num === null) { portfolio[idx].holdQty = null; }
  else { portfolio[idx].holdQty = num; }
  setDirtyFlag();
  updateRow(idx);
  updateFoot();
}

function onCostInput(idx, el) {
  const raw = el.value.trim();
  const num = parseInput(el, raw);
  if (num === undefined) { setDirtyFlag(); return; }
  if (num === null) { portfolio[idx].costPrice = null; }
  else { portfolio[idx].costPrice = num; }
  setDirtyFlag();
  updateRow(idx);
  updateFoot();
}

function onPriceInput(idx, el) {
  const raw = el.value.trim();
  const num = parseInput(el, raw);
  if (num === undefined) { setDirtyFlag(); return; }
  if (num === null) { portfolio[idx].price = null; }
  else { portfolio[idx].price = num; }
  setDirtyFlag();
  updateRow(idx);
  updateFoot();
}

  for (const code in dict) {
    const name = dict[code];
    if (name && !_nameToCode[name]) _nameToCode[name] = code;
  }
  return _nameToCode;
}

function getStockCode(name) {
  if (!name) return '';
  // 1. 优先用数据库里的 code
  const s = portfolio.find(p => p.name === name);
  if (s && s.code) return s.code;
  // 2. 用全量映射表按名称反查代码
  const nt = getNameToCode();
  if (nt[name]) return nt[name];
  // 3. 硬编码兑底
  return STOCK_CODE_MAP[name] || '';
}

// 补全并回写缺失的 code（按名称从全量表反查）
async function backfillMissingCodes() {
  if (!_user) return;
  let changed = false;
  const nt = getNameToCode();
  portfolio.forEach(s => {
    if (!s.code && s.name && nt[s.name]) {
      s.code = nt[s.name];
      changed = true;
    }
  });
  if (changed) {
    // 回写数据库（逐条 upsert code）
    try {
      for (const s of portfolio) {
        if (s.id && s.code) {
          await _supabase.from('stocks').update({ code: s.code }).eq('id', s.id);
        }
      }
    } catch(e) { console.error('backfill code failed:', e); }
  }
  return changed;
}

// ========== 实时行情获取 ==========
let _refreshTimer = null;
let _refreshing = false; // 防抖锁：防止连点/并发触发 refreshPrices
async function refreshPrices() {
  if (_refreshing) return; // 已有刷新在进行，直接忽略本次点击
  _refreshing = true;
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = '⏳ 获取中...';

  // 收集需要获取行情的股票代码
  const tasks = [];
  portfolio.forEach((s, i) => {
    const code = getStockCode(s.name);
    if (code) tasks.push({ idx: i, code: code });
  });

  if (tasks.length === 0) {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = '🔄 更新现价';
    _refreshing = false;
    showToast('没有可获取行情的股票（请先设置股票代码）', 'error');
    return;
  }

  // 批量查询（腾讯接口支持多只用逗号分隔）
  const codes = tasks.map(t => t.code).join(',');
  try {
    const resp = await fetch('https://qt.gtimg.cn/q=' + codes);
    const raw = await resp.text();
    // 编码转换：腾讯返回 GBK，浏览器自动解码
    const lines = raw.split(';').filter(l => l.trim());
    let updated = 0;
    lines.forEach(line => {
      const m = line.match(/v_([a-z]{2}\d+)="(.*)"/);
      if (!m) return;
      const code = m[1];
      const fields = m[2].split('~');
      // fields[3] = 现价, fields[1] = 名称
      const price = parseFloat(fields[3]);
      if (isNaN(price) || price <= 0) return;
      const task = tasks.find(t => t.code === code);
      if (task) {
        portfolio[task.idx].price = price;
        updated++;
      }
    });

    if (updated > 0) {
      // 更新所有行的显示
      portfolio.forEach((s, i) => {
        updateRow(i);
        // 同步更新价格输入框
        const priceEl = document.getElementById('price_' + i);
        if (priceEl && s.price != null && !isNaN(s.price) && s.price > 0) {
          priceEl.value = s.price.toFixed(2);
        }
      });
      updateFoot();
      setDirtyFlag();
      // 自动云同步：更新现价时，把持仓/成本等所有未保存修改一并落库
      await saveAll();
    } else {
      showToast('未获取到行情数据', 'error');
    }
  } catch(e) {
    console.error('Refresh price failed:', e);
    showToast('获取行情失败：' + e.message, 'error');
  }

  btn.disabled = false;
  btn.classList.remove('loading');
  btn.textContent = '🔄 更新现价';
  _refreshing = false;
}

async function saveAll() {
  const now = new Date();
  const dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

    String(now.getMinutes()).padStart(2, '0');

  portfolio.forEach(s => {
    s.date = dateStr;

  });

  // Save to localStorage（同步，立即持久化到本地）
  const toSave = portfolio.map(s => ({
    id: s.id, name: s.name, code: s.code || '', costPrice: s.costPrice, holdQty: s.holdQty,
    price: s.price, date: s.date, time: s.time,

    mode: s.mode || 'reverse',

    nTPrice1: s.nTPrice1 || 0, nTQty: s.nTQty || 0, nTPrice2: s.nTPrice2 || 0,

  btn.textContent = '⏳ 同步中...';

  // 【关键】立即同步云端，不等防抖
  const synced = await _syncOverviewToSupabase();
  if (synced) {
    btn.textContent = '✓ 已保存';
    showToast('已保存 · ' + dateStr + ' ' + timeStr, 'success');
  } else if (_user) {
    btn.textContent = '⚠️ 同步失败';
    btn.disabled = false;
    showToast('本地已存，云端同步失败，请重试', 'error');
  } else {
    btn.textContent = '✓ 已保存';
    showToast('已保存到本地（未登录）', 'success');
  }

// ===== 同步互斥锁：串行化云端覆写，杜绝 delete/insert 并发交错导致数据翻倍 =====
let _syncChain = Promise.resolve();

// 返回 true 表示云端同步成功；未登录时返回 null（跳过）
function _syncOverviewToSupabase() {
  if (!_user) return Promise.resolve(null);
  // 排队：确保同一时刻只有一个同步在跑，后到的等前一个完成
  const run = _syncChain.then(async () => {
    // 【安全防护】portfolio 为空时禁止同步，防止误清空云端数据
    if (!portfolio || portfolio.length === 0) {
      console.warn('Overview sync aborted: portfolio empty');
      return false;
    }
    try {
      // 给缺少 id 的条目补稳定 id（老数据/异常兜底）
      portfolio.forEach(s => {
        if (!s.id) s.id = (crypto.randomUUID ? crypto.randomUUID() : ('s' + Date.now() + '-' + Math.random().toString(36).slice(2)));
      });
      // 快照当前 portfolio，避免同步过程中用户又改了引用
      const snapshot = portfolio.slice();
      const idSet = new Set(snapshot.map(s => s.id).filter(Boolean));
      const rows = snapshot.map((s, i) => ({
        id: s.id,
        user_id: _user.id,
        name: s.name,
        code: s.code || '',
        cost_price: s.costPrice,
        hold_qty: s.holdQty,
        open_price: s.price || 0,
        // 透传保留做T参数，绝不抹成 0（否则会破坏做T计算器页设置的数据）
        t_price1: s.tPrice1 || 0,
        t_qty: s.tQty || 0,
        t_price2: s.tPrice2 || 0,
        n_t_price1: s.nTPrice1 || 0,
        n_t_qty: s.nTQty || 0,
        n_t_price2: s.nTPrice2 || 0,
        mode: s.mode || 'reverse',
        sort_order: i,
      }));
      // upsert（按 id 冲突更新），不再 delete-all + insert 的非原子写法
      const { error } = await _supabase.from('stocks').upsert(rows, { onConflict: 'id' });
      if (error) throw error;
      // 精准清理：删掉本用户已不在快照的旧行，绝不 delete-all 误清空
      const { data: existing, error: selErr } = await _supabase.from('stocks')
        .select('id').eq('user_id', _user.id);
      if (selErr) throw selErr;
      const staleIds = (existing || [])
        .filter(r => !idSet.has(r.id))
        .map(r => r.id);
      if (staleIds.length > 0) {
        await _supabase.from('stocks').delete().in('id', staleIds).eq('user_id', _user.id);
      }
      return true;
    } catch(e) {
      console.error('Overview sync failed:', e);
      return false;
    }
  });
  // 无论成败都继续释放锁链
  _syncChain = run.catch(() => {});
  return run;
}

// ── 通知 / 声音 ──
function _ovRequestNotify() {

function _ovEnsureAudio() {

    if (!_ovAudioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) _ovAudioCtx = new AC(); }
    if (_ovAudioCtx && _ovAudioCtx.state === 'suspended') _ovAudioCtx.resume();
  } catch (e) {}

function _ovBeep() {
  try {
    _ovEnsureAudio(); if (!_ovAudioCtx) return;
    [0, 0.18, 0.36].forEach(function (off) {
      const o = _ovAudioCtx.createOscillator(), g = _ovAudioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, _ovAudioCtx.currentTime + off);
      g.gain.exponentialRampToValueAtTime(0.25, _ovAudioCtx.currentTime + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, _ovAudioCtx.currentTime + off + 0.15);
      o.connect(g); g.connect(_ovAudioCtx.destination);
      o.start(_ovAudioCtx.currentTime + off); o.stop(_ovAudioCtx.currentTime + off + 0.16);
    });
  } catch (e) {}
}

async function ovCheckAlertsOnce() {
  try {
    if (document.visibilityState !== 'visible') return;
    if (!portfolio || portfolio.length === 0) return;
    const targets = [];
    portfolio.forEach(function (s) {
      const k = ovAlertKey(s);
      const a = k ? _ovAlerts[k] : null;
      if (!a || !a.active || !(a.price > 0)) return;
      const code = getStockCode(s.name);
      if (code) targets.push({ stock: s, key: k, code: code, alert: a });
    });
    if (targets.length === 0) return;
    const codes = targets.map(function (t) { return t.code; }).join(',');
    const resp = await fetch('https://qt.gtimg.cn/q=' + codes);
    const raw = await resp.text();
    targets.forEach(function (t) {
      const m = raw.match(new RegExp('v_' + t.code + '="([^"]*)"', 'i'));
      if (!m) return;
      const fields = m[1].split('~');
      const price = parseFloat(fields[3]);
      if (isNaN(price) || price <= 0) return;
      const a = _ovAlerts[t.key];
      if (!a || !a.active) return;
      const hit = (a.dir === 'up') ? (price >= a.price) : (price <= a.price);
      if (hit) _ovFire(t.stock, t.key, price, a);
    });
  } catch (e) { console.warn('ov alert poll failed:', e); }

}

        bar.id = 'sbDownBar';
        bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:10000;background:#E60012;color:#fff;font-size:12px;line-height:1.5;padding:8px 12px;text-align:center;font-weight:600;';
        document.body.appendChild(bar);
      }
      bar.textContent = '⚠️ ' + reason + '，已进入降级模式（数据仅存本机，可正常计算）';
    } catch(e) {}
  }
  setTimeout(function(){
    if (window.__bootOk) return;
    var why = (typeof supabase === 'undefined' || !window.supabase || !window.supabase.createClient)
      ? '云端库加载失败'
      : '页面初始化未完成（浏览器内核可能过旧）';
    forceShow(why);
  }, 3500);
})();
</script>
