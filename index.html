<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>做T计算器</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --profit:      #E60012;
  --profit-bg:   #FEF0F0;
  --loss:        #2D8A4E;
  --loss-bg:     #EEF7F0;
  --gold:        #D4A843;
  --gold-light:  #FAF4E5;
  --bg:          #FBF6F0;
  --card:        #FFFFFF;
  --text:        #3D2E2E;
  --text-secondary: #8B7870;
  --text-muted:  #B8A8A0;
  --border:      #E8DCD0;
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.04);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.05);
  --shadow-focus: 0 0 0 3px rgba(230,0,18,0.08);
  --radius:      12px;
  --transition:  0.15s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none;
  user-select: none;
}
.app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 440px; margin: 0 auto;
  padding: 4px 10px 8px;
}
/* Header — compact */
.header {
  flex-shrink: 0; text-align: center; padding: 2px 0 4px;
  margin-bottom: 4px;
}
.header h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.15rem; font-weight: 700; color: var(--profit);
  letter-spacing: 3px;
}

/* ──── Stock Tab Bar ──── */
.stock-tab-bar {
  flex-shrink: 0; display: flex; gap: 6px;
  margin-bottom: 6px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.stock-tab-bar::-webkit-scrollbar { display: none; }
.stock-tab {
  flex-shrink: 0; padding: 6px 14px;
  border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all var(--transition);
  color: var(--text-secondary); white-space: nowrap;
  font-family: inherit;
  position: relative;
}
.stock-tab.active {
  border-color: var(--profit); background: var(--profit-bg); color: var(--profit);
}
.stock-tab .del-stock {
  display: none; position: absolute; top: -6px; right: -6px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--text-muted); color: #FFF; font-size: 0.6rem;
  line-height: 18px; text-align: center; border: none; cursor: pointer;
}
.stock-tab.editing .del-stock { display: block; }
.stock-tab .del-stock:hover { background: var(--profit); }
.stock-tab.drag-ghost { opacity: 0.25; min-width: 0; width: 0; padding: 0; margin: 0; border-width: 0; overflow: hidden; transition: all 0.25s ease; }
.drag-clone { position: fixed; z-index: 9999; pointer-events: none; opacity: 0.9; transform: scale(1.06); box-shadow: 0 6px 20px rgba(0,0,0,0.2); border-radius: 20px; transition: none; }
.add-stock-btn {
  flex-shrink: 0; width: 36px; height: 36px;
  border-radius: 50%; border: 1.5px dashed var(--border);
  background: transparent; font-size: 1.1rem; color: var(--text-muted);
  cursor: pointer; transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; line-height: 1;
}
.add-stock-btn:active { border-color: var(--profit); color: var(--profit); }

/* ──── Position Snapshot Row ──── */
.pos-snapshot {
  flex-shrink: 0; display: flex; gap: 8px; margin-bottom: 6px;
  font-size: 0.72rem; color: var(--text-secondary);
  background: var(--card); border-radius: 8px;
  padding: 5px 10px; box-shadow: var(--shadow-sm);
  align-items: center; justify-content: center; flex-wrap: wrap;
}
.pos-snapshot .snap-item { white-space: nowrap; }
.pos-snapshot .snap-val { font-weight: 700; color: var(--text); }
.pos-snapshot .snap-cost { color: var(--profit); }
.pos-snapshot .snap-val.profit { color: var(--profit); }
.pos-snapshot .snap-val.loss { color: var(--loss); }

/* Mode Toggle */
.mode-toggle {
  flex-shrink: 0; display: flex; gap: 6px; margin-bottom: 6px;
}
.mode-btn {
  flex: 1; padding: 7px 0; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: all var(--transition);
  color: var(--text-secondary); font-family: inherit;
}
.mode-btn.active {
  border-color: var(--profit); background: var(--profit-bg); color: var(--profit);
}

/* Scrollable Input Area */
.scroll-area {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.input-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-card); padding: 10px 14px; margin-bottom: 8px;
}
.input-card h2 {
  font-size: 0.88rem; font-weight: 700; color: var(--profit);
  margin-bottom: 8px; padding-bottom: 5px;
  border-bottom: 1px dashed var(--border);
  font-family: 'Noto Serif SC', serif;
  display: flex; align-items: center; gap: 6px;
  letter-spacing: 2px;
  cursor: pointer; user-select: none;
}
.input-card h2 .icon { font-size: 0.9rem; }
.input-card h2 .arrow { font-size: 0.7rem; margin-left: auto; color: var(--text-muted); transition: transform 0.2s; }
.input-card h2 .arrow.open { transform: rotate(90deg); }

.input-card .fold-body { display: block; }
.input-card .fold-body.hidden { display: none; }

.input-row {
  display: grid; align-items: center;
  grid-template-columns: 84px 30px 1fr 30px 28px;
  gap: 6px; margin-bottom: 6px;
}
.input-row:last-child { margin-bottom: 0; }
.input-row label {
  font-size: 0.82rem; color: var(--text-secondary); white-space: nowrap;
  min-width: 84px; flex-shrink: 0; font-family: 'Noto Serif SC', serif;
}
.input-row input {
  flex: 1; min-width: 0;
  padding: 8px 10px; font-size: 0.95rem; font-weight: 500;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
  text-align: right; transition: all var(--transition);
  -webkit-appearance: none; font-family: inherit;
  -webkit-user-select: text;
  user-select: text;
}
.input-row input:focus {
  outline: none; border-color: var(--profit); background: #FFF;
  box-shadow: var(--shadow-focus);
}
.input-row input:disabled {
  opacity: 0.4; background: #F5F5F5;
}
.input-row .unit {
  font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; min-width: 20px; text-align: right;
}

/* Spin buttons */
.spin-btn {
  width: 30px; height: 36px; flex-shrink: 0;
  border: 1.5px solid var(--border); border-radius: 6px;
  background: var(--card); color: var(--text-secondary);
  font-size: 0.7rem; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); user-select: none;
  -webkit-user-select: none;
}
.spin-btn:active { background: var(--profit-bg); color: var(--profit); border-color: var(--profit); }
.spin-btn:disabled { opacity: 0.3; pointer-events: none; }

/* Highlight row for key input */
.input-row.key-row {
  background: var(--profit-bg);
  border-radius: 8px;
  padding: 4px 6px;
  margin: 0 -6px 6px;
}
.input-row.key-row input {
  border-color: var(--profit);
  background: #FFF;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--profit);
  touch-action: none;
}
.input-row.key-row label {
  font-weight: 700;
  color: var(--profit);
}
.input-row.key-row input.sliding {
  background: #FFF5F5;
  border-color: #CC0008;
}

/* Ref tag row */
#refTagRow {
  margin-top: 2px; margin-bottom: 0;
  padding-left: 88px;
  gap: 8px;
  display: flex; align-items: center;
}
#refTagRow .ref-tag { margin: 0; }

/* Ref tag */
.ref-tag {
  font-size: 0.76rem; color: var(--gold); white-space: nowrap;
  flex-shrink: 0; background: var(--gold-light);
  padding: 6px 16px; border-radius: 18px;
  cursor: pointer; border: 1.5px solid var(--gold);
  transition: all var(--transition); user-select: none;
  font-weight: 700; letter-spacing: 0.5px;
}
.ref-tag:hover { background: #FDF0D5; }
.ref-tag:active, .ref-tag.active { background: var(--gold); color: #FFF; }

/* Fee card */
.fee-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-card); padding: 10px 14px; margin-bottom: 8px;
}
.fee-card h3 {
  font-size: 0.88rem; font-weight: 700; color: var(--text-secondary);
  margin-bottom: 6px; letter-spacing: 2px;
  font-family: 'Noto Serif SC', serif;
}
.fee-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
}
.fee-row:last-child { margin-bottom: 0; }
.fee-row label {
  font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; min-width: 54px;
  font-family: 'Noto Serif SC', serif;
}
.fee-row input {
  width: 60px; padding: 5px 6px; font-size: 0.84rem;
  border: 1.5px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); text-align: right;
  font-family: inherit;
}
.fee-row input:focus {
  outline: none; border-color: var(--gold);
}
.fee-row .desc {
  font-size: 0.72rem; color: var(--text-muted); margin-left: 2px;
}
.fee-info {
  font-size: 0.7rem; color: var(--text-muted);
  margin-top: 4px; padding-top: 4px;
  border-top: 1px dotted var(--border);
  display: flex; flex-wrap: wrap; gap: 6px;
}
.fee-info span { white-space: nowrap; }

/* Calculate Button */
.calc-btn {
  width: 100%; padding: 12px;
  border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--profit), #B8000E);
  color: #FFF; font-size: 1rem; font-weight: 700;
  cursor: pointer; letter-spacing: 3px;
  margin-bottom: 8px; transition: all var(--transition);
  font-family: 'Noto Serif SC', serif;
}
.calc-btn:active { transform: scale(0.98); opacity: 0.9; }

/* Result Card */
.result-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-card); padding: 14px;
  margin-bottom: 8px; display: none;
}
.result-card.show { display: block; border: 1.5px solid var(--gold); }
.result-card h2 {
  font-size: 0.88rem; font-weight: 700; color: var(--profit);
  margin-bottom: 8px; font-family: 'Noto Serif SC', serif;
  display: flex; align-items: center; gap: 6px;
}
.result-card h2 .icon { font-size: 0.9rem; }

.result-big {
  text-align: center; padding: 8px 0 10px;
  border-bottom: 1px dashed var(--border); margin-bottom: 8px;
  position: relative;
}
.result-big .label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 1px; }
.result-big .value {
  font-size: 2rem; font-weight: 800; line-height: 1.15;
}
.result-big .value.profit { color: var(--profit); }
.result-big .value.loss { color: var(--loss); }
.result-big .pct {
  font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-top: 2px;
}

/* Copy button */
.copy-btn {
  position: absolute; top: 0; right: 0;
  font-size: 0.6rem; padding: 3px 8px;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--card); color: var(--text-muted);
  cursor: pointer; transition: all var(--transition);
  font-family: inherit;
}
.copy-btn:active { background: var(--gold-light); color: var(--gold); }
.copy-btn.copied { color: var(--loss); border-color: var(--loss); }

.result-detail {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px;
}
.result-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 3px 0; font-size: 0.76rem;
}
.result-item .key { color: var(--text-secondary); }
.result-item .val { font-weight: 600; color: var(--text); }
.result-item.full { grid-column: 1 / -1; }

.new-cost {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--border);
  text-align: center;
}
.new-cost .label { font-size: 0.65rem; color: var(--text-muted); }
.new-cost .value {
  font-size: 1.2rem; font-weight: 800; color: var(--profit);
}

/* Footer */
.footer {
  flex-shrink: 0; text-align: center; padding: 2px 0 0;
  font-size: 0.55rem; color: var(--text-muted);
}

/* ──── Stock Edit Modal ──── */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3); z-index: 100;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--card); border-radius: var(--radius);
  padding: 20px; width: 300px; max-width: 90vw;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.modal-box h3 {
  font-size: 1rem; font-weight: 700; color: var(--profit);
  margin-bottom: 12px; font-family: 'Noto Serif SC', serif;
}
.modal-box .field { margin-bottom: 10px; }
.modal-box .field label {
  display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 3px;
}
.modal-box .field input {
  width: 100%; padding: 8px 10px; font-size: 0.9rem;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-family: inherit;
}
.modal-box .field input:focus {
  outline: none; border-color: var(--profit);
}
.modal-actions {
  display: flex; gap: 8px; margin-top: 14px;
}
.modal-actions button {
  flex: 1; padding: 8px; border-radius: 8px; border: none;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit;
}
.modal-actions .btn-save {
  background: var(--profit); color: #FFF;
}
.modal-actions .btn-cancel {
  background: var(--bg); color: var(--text-secondary);
}

@media (min-width: 440px) {
  .app {
    margin-top: 12px;
    margin-bottom: 12px;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
}
</style>
</head>

<script>
// ========== SUPABASE INIT ==========
const _supabase = (typeof supabase !== 'undefined' && supabase.createClient)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_ANON_KEY);
let _user = null;  // 当前登录用户

// ========== AUTH FUNCTIONS ==========
const AUTH_KEY = 'tcalc_user_v1';

function showAuth() {
  document.getElementById('authOverlay').style.display = 'flex';
  document.querySelector('.app').style.display = 'none';
}
function hideAuth() {
  document.getElementById('authOverlay').style.display = 'none';
  document.querySelector('.app').style.display = 'flex';
}
function setAuthMsg(msg, isError) {
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.style.color = isError ? 'var(--profit)' : 'var(--loss, #2D8A4E)';
}

async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthMsg('请输入邮箱和密码', true); return; }
  document.getElementById('loginBtn').disabled = true;
  setAuthMsg('登录中...', false);
  const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
  document.getElementById('loginBtn').disabled = false;
  if (error) { setAuthMsg(error.message, true); return; }
  _user = data.user;
  localStorage.setItem(AUTH_KEY, JSON.stringify({ email: _user.email }));
  hideAuth();
  await initApp();
}

async function doSignup() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthMsg('请输入邮箱和密码', true); return; }
  if (password.length < 6) { setAuthMsg('密码至少6位', true); return; }
  document.getElementById('signupBtn').disabled = true;
  setAuthMsg('注册中...', false);
  const { data, error } = await _supabase.auth.signUp({
    email, password,
    options: { emailRedirectTo: 'https://t.ai-zhihui.cn' }
  });
  document.getElementById('signupBtn').disabled = false;
  if (error) { setAuthMsg(error.message, true); return; }
  if (data.user && !data.session) {
    setAuthMsg('注册成功！请查收邮箱确认链接，然后登录。', false);
  } else {
    _user = data.user;
    localStorage.setItem(AUTH_KEY, JSON.stringify({ email: _user.email }));
    hideAuth();
    await initApp();
  }
}

async function doMagicLink() {
  const email = document.getElementById('authEmail').value.trim();
  if (!email) { setAuthMsg('请输入邮箱', true); return; }
  setAuthMsg('发送中...', false);
  const { error } = await _supabase.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: 'https://t.ai-zhihui.cn' }
  });
  if (error) { setAuthMsg(error.message, true); return; }
  setAuthMsg('✅ 登录链接已发送到邮箱，请点击链接登录', false);
}

async function doLogout() {
  await _supabase.auth.signOut();
  _user = null;
  localStorage.removeItem(AUTH_KEY);
  showAuth();
}

async function checkSession() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session?.user) {
    _user = session.user;
    hideAuth();
    await initApp();
  } else {
    showAuth();
  }
}

// ========== DATA ENGINE ==========
const STORAGE_KEY_PORTFOLIO = 'tcalc_portfolio_v2';
const STORAGE_KEY_HISTORY = 'tcalc_history_v2';
const STORAGE_KEY_PREFS = 'tcalc_prefs_v2';
const MAX_HISTORY_PER_STOCK = 20;

let portfolio = [];       // [{ id, name, costPrice, holdQty, mode, openPrice, tPrice1, tQty, tPrice2 }]
let currentStockIndex = 0;
let currentMode = 'reverse';
let editingStockId = null;

function saveAll() {
  // Save all form values into current stock object
  if (portfolio.length > 0 && currentStockIndex < portfolio.length) {
    const s = portfolio[currentStockIndex];
    s.costPrice = parseFloat(document.getElementById('costPrice').value) || s.costPrice;
    s.holdQty = parseInt(document.getElementById('holdQty').value, 10) || s.holdQty;
    s.mode = currentMode;
    s.openPrice = parseFloat(document.getElementById('openPrice').value) || s.openPrice;
    s.tPrice1 = parseFloat(document.getElementById('tPrice1').value) || s.tPrice1;
    s.tQty = parseInt(document.getElementById('tQty').value, 10) || s.tQty;
    s.tPrice2 = parseFloat(document.getElementById('tPrice2').value) || s.tPrice2;
  }
  // 本地备份
  localStorage.setItem(STORAGE_KEY_PORTFOLIO, JSON.stringify(portfolio));
  localStorage.setItem(STORAGE_KEY_PREFS, JSON.stringify({
    currentStockIndex: currentStockIndex,
    currentMode: currentMode,
    posFolded: document.getElementById('posFold').classList.contains('hidden'),
  }));
  // 云端同步（防抖）
  _syncToSupabase();
}

let _syncTimer = null;
function _syncToSupabase() {
  if (!_user) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    if (!_user) return;
    try {
      // 先删除该用户所有旧数据，再全量写入
      await _supabase.from('stocks').delete().eq('user_id', _user.id);
      if (portfolio.length > 0) {
        const rows = portfolio.map((s, i) => ({
          user_id: _user.id,
          name: s.name,
          cost_price: s.costPrice,
          hold_qty: s.holdQty,
          open_price: s.openPrice,
          t_price1: s.tPrice1,
          t_qty: s.tQty,
          t_price2: s.tPrice2,
          mode: s.mode || 'reverse',
          sort_order: i,
        }));
        await _supabase.from('stocks').insert(rows);
      }
    } catch(e) { console.error('Sync failed:', e); }
  }, 800);
}

function saveDebounced() {
  clearTimeout(window._saveTimeout);
  window._saveTimeout = setTimeout(saveAll, 500);
}

async function loadDataFromCloud() {
  if (!_user) return false;
  try {
    const { data, error } = await _supabase.from('stocks')
      .select('*')
      .eq('user_id', _user.id)
      .order('sort_order');
    if (error || !data || data.length === 0) return false;
    // 按名称去重，保留最后一条
    const seen = new Map();
    data.forEach(row => { seen.set(row.name, row); });
    const deduped = Array.from(seen.values());
    portfolio = deduped.map(row => ({
      id: row.id,
      name: row.name,
      costPrice: parseFloat(row.cost_price) || 0,
      holdQty: parseInt(row.hold_qty) || 0,
      openPrice: parseFloat(row.open_price) || 10,
      tPrice1: parseFloat(row.t_price1) || 10,
      tQty: parseInt(row.t_qty) || 1000,
      tPrice2: parseFloat(row.t_price2) || 9.9,
      mode: row.mode || 'reverse',
    }));
    // 如果有重复被去除了，同步清理云端
    if (deduped.length < data.length) {
      localStorage.setItem(STORAGE_KEY_PORTFOLIO, JSON.stringify(portfolio));
      _syncToSupabase();
    }
    return true;
  } catch(e) { console.error('Load from cloud failed:', e); return false; }
}

function loadData() {
  // 本地同步读取（先用localStorage保证速度）
  const rawP = localStorage.getItem(STORAGE_KEY_PORTFOLIO);
  if (rawP) {
    try { portfolio = JSON.parse(rawP); } catch(e) { portfolio = []; }
  }
  portfolio.forEach(s => {
    if (!s.mode) s.mode = 'reverse';
    if (!s.openPrice) s.openPrice = 10;
    if (!s.tPrice1) s.tPrice1 = 10;
    if (!s.tQty) s.tQty = 1000;
    if (!s.tPrice2) s.tPrice2 = 9.9;
  });

  const rawPrefs = localStorage.getItem(STORAGE_KEY_PREFS);
  let prefs = {};
  if (rawPrefs) {
    try { prefs = JSON.parse(rawPrefs); } catch(e) {}
  }
  currentStockIndex = (typeof prefs.currentStockIndex === 'number' && prefs.currentStockIndex < portfolio.length)
    ? prefs.currentStockIndex : 0;
  currentMode = prefs.currentMode || 'reverse';
}

async function loadDataAsync() {
  if (!_user) return;
  const cloudOk = await loadDataFromCloud();
  if (cloudOk) {
    // 云端数据优先，完全覆盖本地
    portfolio = portfolio; // loadDataFromCloud已更新portfolio
    localStorage.setItem(STORAGE_KEY_PORTFOLIO, JSON.stringify(portfolio));
    if (portfolio.length > 0 && currentStockIndex >= portfolio.length) currentStockIndex = 0;
    loadStockIntoForm();
    buildTabBar();
    updateSnapshot();
  } else {
    // 云端无数据，清空本地（新用户应该是空的）
    portfolio = [];
    currentStockIndex = 0;
    localStorage.removeItem(STORAGE_KEY_PORTFOLIO);
    loadStockIntoForm();
    buildTabBar();
    updateSnapshot();
  }
}

    { id: 's2', name: '维远股份', costPrice: 15.5713, holdQty: 6000, mode: 'reverse', openPrice: 12.72, tPrice1: 12.72, tQty: 6000, tPrice2: 12.50 },
    { id: 's3', name: '京东方A',  costPrice: 8.6212,  holdQty: 4000, mode: 'reverse', openPrice: 6.00,  tPrice1: 6.00,  tQty: 4000, tPrice2: 5.88 }

// Update snapshot row
function updateSnapshot() {
  if (portfolio.length === 0 || currentStockIndex >= portfolio.length) {
    document.getElementById('posSnapshot').innerHTML = '<span style="color:var(--text-muted)">暂无持仓</span>';
    return;
  }

// Build tab bar
function buildTabBar() {
  const bar = document.getElementById('stockTabBar');
  let html = '';
  portfolio.forEach((s, i) => {
    const activeCls = (i === currentStockIndex) ? ' active' : '';
    html += '<span class="stock-tab' + activeCls + '" data-idx="' + i + '">'
      + escapeHtml(s.name)
      + '<span class="del-stock" onclick="event.stopPropagation();deleteStockConfirm(' + i + ')">✕</span>'
      + '</span>';
  });
  html += '<button class="add-stock-btn" onclick="openAddModal()" title="新增持仓">+</button>';
  bar.innerHTML = html;
}

// ──── Tab Drag (Pointer Events, desktop+mobile unified) ────
let _dragState = null;
function initTabDrag() {
  const bar = document.getElementById('stockTabBar');
  bar.addEventListener('pointerdown', function(e) {
    if (e.button && e.button !== 0) return;
    const tab = e.target.closest('.stock-tab');
    if (!tab) return;
    const idx = parseInt(tab.dataset.idx);
    if (isNaN(idx)) return;
    _dragState = { fromIdx: idx, startX: e.clientX, startY: e.clientY, moved: false, longPressTimer: null, clone: null, ghost: null };
    _dragState.longPressTimer = setTimeout(function() {
      if (_dragState && !_dragState.moved) {
        _dragState = null;
        document.querySelectorAll('.stock-tab').forEach(t => t.classList.add('editing'));
        setTimeout(() => document.querySelectorAll('.stock-tab').forEach(t => t.classList.remove('editing')), 3000);
      }
    }, 600);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
  });
  // 点击删除按钮（del-stock）
  bar.addEventListener('click', function(e) {
    const delBtn = e.target.closest('.del-stock');
    if (!delBtn) return;
    const tab = delBtn.closest('.stock-tab');
    if (!tab) return;
    const idx = parseInt(tab.dataset.idx);
    if (isNaN(idx)) return;
    deleteStockConfirm(idx);
  });
}

function onPointerMove(e) {
  if (!_dragState) return;
  const dx = Math.abs(e.clientX - _dragState.startX);
  const dy = Math.abs(e.clientY - _dragState.startY);
  if ((dx > 6 || dy > 6) && !_dragState.moved) {
    _dragState.moved = true;
    clearTimeout(_dragState.longPressTimer);
    // 阻止默认行为（防止拖拽时选中文本）
    e.preventDefault();
    // 创建浮动克隆 + 原位变幽灵
    const bar = document.getElementById('stockTabBar');
    const tabs = bar.querySelectorAll('.stock-tab');
    const origTab = tabs[_dragState.fromIdx];
    if (origTab) {
      const clone = origTab.cloneNode(true);
      clone.className = 'stock-tab drag-clone';
      clone.style.width = origTab.offsetWidth + 'px';
      const r = origTab.getBoundingClientRect();
      clone.style.left = r.left + 'px';
      clone.style.top = r.top + 'px';
      document.body.appendChild(clone);
      _dragState.clone = clone;
      origTab.classList.add('drag-ghost');
      _dragState.ghost = origTab;
    }
  }
  if (!_dragState.moved) return;
  // 移动克隆
  if (_dragState.clone) {
    _dragState.clone.style.left = (e.clientX - _dragState.clone.offsetWidth / 2) + 'px';
    _dragState.clone.style.top = (e.clientY - _dragState.clone.offsetHeight / 2) + 'px';
  }
  // 计算悬停位置，移动幽灵到该位置
  const bar = document.getElementById('stockTabBar');
  const tabs = Array.from(bar.querySelectorAll('.stock-tab'));
  const nonGhost = tabs.filter(t => !t.classList.contains('drag-ghost'));
  let insertBefore = null;
  for (const t of nonGhost) {
    const r = t.getBoundingClientRect();
    if (e.clientX < r.left + r.width / 2) { insertBefore = t; break; }
  }
  if (_dragState.ghost) {
    if (insertBefore) {
      bar.insertBefore(_dragState.ghost, insertBefore);
    } else {
      bar.insertBefore(_dragState.ghost, bar.querySelector('.add-stock-btn'));
    }
  }
}

function onPointerUp(e) {
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  if (!_dragState) return;
  clearTimeout(_dragState.longPressTimer);
  // 【单击：moved=false，切换股票】
  if (!_dragState.moved) {
    const fromIdx = _dragState.fromIdx;
    _dragState = null;
    if (fromIdx !== currentStockIndex) switchStock(fromIdx);
    return;
  }
  if (_dragState.clone) {
    // 根据幽灵位置确定最终索引
    const bar = document.getElementById('stockTabBar');
    const tabs = Array.from(bar.querySelectorAll('.stock-tab'));
    const dropIdx = tabs.indexOf(_dragState.ghost);
    const fromIdx = _dragState.fromIdx;
    // 动画：克隆飞到幽灵位置
    if (dropIdx >= 0 && _dragState.ghost) {
      const targetR = _dragState.ghost.getBoundingClientRect();
      _dragState.clone.style.transition = 'all 0.2s ease';
      _dragState.clone.style.left = targetR.left + 'px';
      _dragState.clone.style.top = targetR.top + 'px';
      _dragState.clone.style.transform = 'scale(1)';
    }
    setTimeout(function() {
      if (_dragState && _dragState.clone) _dragState.clone.remove();
      if (_dragState && _dragState.ghost) _dragState.ghost.classList.remove('drag-ghost');
      if (dropIdx >= 0 && dropIdx !== fromIdx) {
        // 【关键】先保存 form 数据到原始位置，再重排数组
        saveAll();
        const item = portfolio.splice(fromIdx, 1)[0];
        portfolio.splice(dropIdx, 0, item);
        if (currentStockIndex === fromIdx) currentStockIndex = dropIdx;
        else if (fromIdx < currentStockIndex && dropIdx >= currentStockIndex) currentStockIndex--;
        else if (fromIdx > currentStockIndex && dropIdx <= currentStockIndex) currentStockIndex++;
      }
      buildTabBar();
      saveAll();
      _dragState = null;
    }, 200);
  } else {
    if (_dragState.clone) _dragState.clone.remove();
    if (_dragState.ghost) _dragState.ghost.classList.remove('drag-ghost');
    _dragState = null;
  }
}

// Init on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initTabDrag);
} else {
  initTabDrag();
}

// Switch stock

  if (idx === currentStockIndex) return;

  currentStockIndex = idx;
  loadStockIntoForm();

  saveAll();
}

  document.getElementById('holdQty').value = s.holdQty;
  document.getElementById('openPrice').value = s.openPrice;
  document.getElementById('tPrice1').value = s.tPrice1;
  document.getElementById('tQty').value = s.tQty;
  document.getElementById('tPrice2').value = s.tPrice2;
  document.getElementById('tPrice2').dataset.autoSet = 'false';
  setMode(s.mode || 'reverse');
  document.getElementById('resultCard').classList.remove('show');
  checkHoldQtySufficient();
}

function openEditModal(idx, name, cost, qty) {
  editingStockId = portfolio[idx].id;

  document.getElementById('modalName').value = name;
  document.getElementById('modalCost').value = cost;
  document.getElementById('modalQty').value = qty;

  setTimeout(function(){ document.getElementById('modalName').focus(); }, 100);
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
}

function saveStock() {
  const name = document.getElementById('modalName').value.trim();
  const cost = parseFloat(document.getElementById('modalCost').value);
  const qty = parseInt(document.getElementById('modalQty').value, 10);

  if (!name) { alert('请输入股票名称'); return; }
  if (isNaN(cost) || cost <= 0) { alert('请输入有效的成本价'); return; }
  if (isNaN(qty) || qty < 100) { alert('持仓数量至少100股'); return; }

  if (editingStockId) {
    // Edit existing
    const idx = portfolio.findIndex(s => s.id === editingStockId);
    if (idx >= 0) {
      portfolio[idx].name = name;
      portfolio[idx].costPrice = cost;
      portfolio[idx].holdQty = qty;
    }
  } else {
    // Add new
    const id = 's' + Date.now();
    portfolio.push({
      id, name,
      costPrice: cost, holdQty: qty,

    });

// ========== Sliding & Spin (same as v4) ==========
let slideState = null;
const SLIDE_PIXEL_STEP = 5;

function sellPriceBounds() {
  const openP = parseFloat(document.getElementById('openPrice').value);
  if (isNaN(openP) || openP <= 0) return { min: 0.01, max: 99999 };
  return { min: Math.round(openP * 0.9 * 100) / 100, max: Math.round(openP * 1.1 * 100) / 100 };
}

function buybackPriceBounds() { return sellPriceBounds(); }
function holdQtyBounds() { return { min: 100, max: 999999 }; }

function tQtyBounds() {
  const min = 100;
  let max = 10000;
  if (currentMode === 'reverse') {
    const holdQty = parseFloat(document.getElementById('holdQty').value) || 0;
    max = Math.min(10000, Math.floor(holdQty / 100) * 100);
    if (max < 100) max = 100;
  }
  return { min, max };
}

function openPriceBounds() { return { min: 0.01, max: 99999 }; }

function slideStart(e, el, getBounds, onChange, step) {
  step = step || 0.01;
  const pos = e.touches ? e.touches[0] : e;
  slideState = {
    inputEl: el, startX: pos.clientX,
    lastVal: parseFloat(el.value) || 0, pixelAccum: 0,
    getBounds: getBounds || function() { return { min: 0.01, max: 99999 }; },
    onChange: onChange || function() {}, step: step, moved: false
  };
  el.style.cursor = 'ew-resize';
  el.classList.add('sliding');
}

function slideMove(e) {
  if (!slideState) return;
  const pos = e.touches ? e.touches[0] : e;
  const dx = pos.clientX - slideState.startX;
  slideState.pixelAccum += dx;
  slideState.startX = pos.clientX;
  const steps = Math.floor(Math.abs(slideState.pixelAccum) / SLIDE_PIXEL_STEP);
  if (steps > 0) {
    e.preventDefault();
    slideState.moved = true;
    const sign = slideState.pixelAccum > 0 ? 1 : -1;
    slideState.pixelAccum -= sign * steps * SLIDE_PIXEL_STEP;
    const s = slideState.step;
    let newVal = Math.round((slideState.lastVal + sign * steps * s) * 100) / 100;
    const b = slideState.getBounds();
    if (newVal < b.min) newVal = b.min;
    if (newVal > b.max) newVal = b.max;
    slideState.lastVal = newVal;
    slideState.inputEl.value = (s >= 1) ? Math.round(newVal).toString() : newVal.toFixed(2);
    slideState.onChange(newVal);
    saveDebounced();
  }
  e.preventDefault();
}

function slideEnd() {
  if (!slideState) return;
  slideState.inputEl.style.cursor = '';
  slideState.inputEl.classList.remove('sliding');
  slideState = null;
}

// ──── Spin buttons ────
let spinTimer = null;
let spinId = null;
let spinDelta = 0;

function spinStart(id, delta) {
  spinStop();
  spinId = id;
  spinDelta = delta;
  applySpin();
  // 首次重复延迟 300ms，之后每 120ms 连续触发
  spinTimer = setTimeout(function() {
    spinTimer = setInterval(function() { applySpin(); }, 120);
  }, 300);
}

function spinStop() {
  if (spinTimer) { clearInterval(spinTimer); clearTimeout(spinTimer); spinTimer = null; }
  spinId = null;
  spinDelta = 0;
}

function applySpin() {
  if (!spinId) return;
  const el = document.getElementById(spinId);
  let val = parseFloat(el.value) || 0;
  if (spinId === 'tQty' || spinId === 'holdQty') {
    val = Math.round(val + spinDelta);
    const bounds = spinId === 'tQty' ? tQtyBounds() : holdQtyBounds();
    if (val < bounds.min) val = bounds.min;
    if (val > bounds.max) val = bounds.max;
    el.value = Math.round(val).toString();
    saveDebounced();
    updateSnapshot();
    return;
  }
  val = Math.round((val + spinDelta) * 100) / 100;
  if (val < 0) val = 0;
  if (val > 99999) val = 99999;
  el.value = val.toFixed(2);
  if (spinId === 'tPrice1') updateRefPrice();
  if (spinId === 'tPrice2') document.getElementById('tPrice2').dataset.autoSet = 'false';
  saveDebounced();
}

// ──── Calculation ────
function parseNum(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}

function calcFee(amount, isSell) {
  let commRate = 0.01854 / 100;
  let comm = amount * commRate;
  let minComm = 5;
  if (comm > 0 && comm < minComm) comm = minComm;
  let stampRate = 0.05 / 100;
  let stamp = isSell ? amount * stampRate : 0;
  let transRate = 0.001 / 100;
  let trans = amount * transRate;
  return { comm, stamp, trans, total: comm + stamp + trans };
}

function fmtMoney(v) {
  if (Math.abs(v) < 0.005) return '0.00';
  return v.toFixed(2);
}

function fmtMoney4(v) {
  if (Math.abs(v) < 0.00005) return '0.0000';
  return v.toFixed(4);
}

function calculate() {
  const tPrice1 = parseNum('tPrice1');
  const tQty = parseNum('tQty');
  const tPrice2 = parseNum('tPrice2');

  if (!tPrice1 || !tQty || !tPrice2) {
    alert('请填写卖出/买入价、操作数量和预期价');
    return;
  }

  const costPrice = parseNum('costPrice');
  const holdQty = parseNum('holdQty');
  let amount1, amount2, fee1, fee2, netOp1, netOp2, diff;

  if (currentMode === 'reverse') {
    amount1 = tPrice1 * tQty;
    fee1 = calcFee(amount1, true);
    amount2 = tPrice2 * tQty;
    fee2 = calcFee(amount2, false);
    netOp1 = amount1 - fee1.total;
    netOp2 = amount2 + fee2.total;
    diff = netOp1 - netOp2;
    document.getElementById('op1Val').textContent = '+' + fmtMoney(netOp1);
    document.getElementById('op2Val').textContent = '-' + fmtMoney(netOp2);
  } else {
    amount1 = tPrice1 * tQty;
    fee1 = calcFee(amount1, false);
    amount2 = tPrice2 * tQty;
    fee2 = calcFee(amount2, true);
    netOp1 = amount1 + fee1.total;
    netOp2 = amount2 - fee2.total;
    diff = netOp2 - netOp1;
    document.getElementById('op1Val').textContent = '-' + fmtMoney(netOp1);
    document.getElementById('op2Val').textContent = '+' + fmtMoney(netOp2);
  }

  document.getElementById('diffVal').textContent = fmtMoney(diff);

  const feeTotal = fee1.total + fee2.total;
  document.getElementById('feeTotal').textContent = fmtMoney(feeTotal);

  const commTotal = fee1.comm + fee2.comm;
  document.getElementById('commDetail').textContent =
    '佣金 ' + fmtMoney(commTotal) + '（买' + fmtMoney(fee1.comm) + ' + 卖' + fmtMoney(fee2.comm) + '）';
  document.getElementById('taxDetail').textContent =
    '印花税 ' + fmtMoney(fee1.stamp + fee2.stamp) + ' + 过户费 ' + fmtMoney(fee1.trans + fee2.trans);

  const bigEl = document.getElementById('resultBig');
  if (diff >= 0) {
    bigEl.textContent = '+' + fmtMoney(diff) + ' 元';
    bigEl.className = 'value profit';
  } else {
    bigEl.textContent = fmtMoney(diff) + ' 元';
    bigEl.className = 'value loss';
  }

  const investCapital = (amount1 + fee1.total);
  const pctEl = document.getElementById('resultPct');
  if (investCapital > 0) {
    const pct = (diff / investCapital * 100);
    const sign = pct >= 0 ? '+' : '';
    pctEl.textContent = sign + pct.toFixed(2) + '%';
    pctEl.style.color = diff >= 0 ? 'var(--profit)' : 'var(--loss)';
  } else {
    pctEl.textContent = '--';
  }

  if (costPrice && holdQty) {
    const totalCostBefore = costPrice * holdQty;
    const totalCostAfter = totalCostBefore - diff;
    const newCostPrice = totalCostAfter / holdQty;
    document.getElementById('newCost').textContent = fmtMoney4(newCostPrice) + ' 元';
    document.getElementById('newCost').style.display = '';
    document.querySelector('.new-cost .label').style.display = '';
  } else {
    document.getElementById('newCost').textContent = '';
    document.getElementById('newCost').style.display = 'none';
    document.querySelector('.new-cost .label').style.display = 'none';
  }

  // Show result + scroll
  const resultCard = document.getElementById('resultCard');
  resultCard.classList.add('show');
  document.getElementById('copyBtn').classList.remove('copied');
  document.getElementById('copyBtn').textContent = '复制';
  resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Save result to history (预留，第二期激活)
  saveHistoryEntry({
    mode: currentMode, stockName: portfolio[currentStockIndex] ? portfolio[currentStockIndex].name : '',
    tPrice1, tQty, tPrice2, diff, feeTotal,
    timestamp: new Date().toISOString()
  });
  saveAll();
}

// ──── History (reserved for phase 2) ────
function saveHistoryEntry(entry) {
  // Phase 2 will render these; for now just store
  const raw = localStorage.getItem(STORAGE_KEY_HISTORY);
  let history = [];
  if (raw) { try { history = JSON.parse(raw); } catch(e) {} }
  history.unshift(entry);
  if (history.length > 100) history = history.slice(0, 100);
  localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
}

// ──── Copy ────
function copyResult() {
  const lines = [];
  const stockName = portfolio[currentStockIndex] ? portfolio[currentStockIndex].name : '';
  lines.push('=== 做T预估结果 ===');
  lines.push('股票：' + stockName);
  lines.push('模式：' + (currentMode === 'reverse' ? '倒T（高抛低吸）' : '正T（先买后卖）'));
  lines.push(document.getElementById('op1Label').textContent + '：' + document.getElementById('op1Val').textContent);
  lines.push(document.getElementById('op2Label').textContent + '：' + document.getElementById('op2Val').textContent);
  lines.push('差价：' + document.getElementById('diffVal').textContent + ' 元');
  lines.push('手续费合计：' + document.getElementById('feeTotal').textContent + ' 元');
  lines.push('净盈亏：' + document.getElementById('resultBig').textContent);
  lines.push('盈亏率：' + document.getElementById('resultPct').textContent);
  lines.push('新持仓成本：' + document.getElementById('newCost').textContent);

  const text = lines.join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '已复制 ✓';
      btn.classList.add('copied');
      setTimeout(function() { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '已复制 ✓';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  }
}

// 全局：同步失败重试计数
let _syncRetries = 0;
_syncToSupabase = function() {
  if (!_user) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    if (!_user) return;
    // 【安全防护】portfolio 为空时禁止同步，防止误清空云端数据
    if (!portfolio || portfolio.length === 0) {
      console.warn('Sync aborted: portfolio empty, refusing to wipe cloud data');
      return;
    }
    try {
      // 按名称去重，保留最后一个（最新的）
      const seen = new Map();
      portfolio.forEach(s => { seen.set(s.name, s); });
      const deduped = Array.from(seen.values());
      portfolio = deduped;
      // 先删除旧数据，再全量写入
      await _supabase.from('stocks').delete().eq('user_id', _user.id);
      if (deduped.length > 0) {
        const rows = deduped.map((s, i) => ({
          user_id: _user.id,
          name: s.name,
          cost_price: s.costPrice,
          hold_qty: s.holdQty,
          open_price: s.openPrice,
          t_price1: s.tPrice1,
          t_qty: s.tQty,
          t_price2: s.tPrice2,
          mode: s.mode || 'reverse',
          sort_order: i,
        }));
        await _supabase.from('stocks').insert(rows);
      }
      _syncRetries = 0;
    } catch(e) {
      console.error('Sync failed:', e);
      if (_syncRetries < 3) { _syncRetries++; setTimeout(_syncToSupabase, 2000); }
    }
  }, 800);
};

})();
